    <title>Deeni — Your Path of Light</title>
    <script>
      // Apply the saved/system theme before React mounts and before first
      // paint, so dark-mode users don't see a flash of the light theme
      // while useTheme's effect runs after hydration.
      (function () {
        try {
          var stored = localStorage.getItem("deeni_theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage may be unavailable (e.g. privacy mode) — default to light */
        }
      })();
    </script>
