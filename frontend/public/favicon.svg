<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/> <!-- Emerald 900 -->
      <stop offset="0.5" stop-color="#047857"/> <!-- Emerald 700 -->
      <stop offset="1" stop-color="#065f46"/> <!-- Emerald 800 -->
    </linearGradient>

    <!-- Glowing Effect for Crescent & Star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Golden Gradient for Star -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" /> <!-- Yellow 200 -->
      <stop offset="100%" stop-color="#f59e0b" /> <!-- Amber 500 -->
    </linearGradient>
  </defs>

  <!-- Base rounded rect with deep green gradient and subtle stroke -->
  <rect width="64" height="64" rx="18" fill="url(#g)" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
  
  <g filter="url(#glow)">
    <!-- Modern crescent (slightly sharper, rotated for dynamic feel) -->
    <path d="M42 34A14 14 0 1 1 24 16a11 11 0 1 0 18 18z" fill="#ecfdf5"/> <!-- Emerald 50 -->
    
    <!-- Dynamic star (sharper points, placed perfectly in the crescent curve) -->
    <path d="M43 23l1.5 3 3.3.5-2.4 2.3.6 3.3-2.9-1.5-3 1.5.6-3.3-2.4-2.3 3.3-.5z" fill="url(#gold)"/>
  </g>
</svg>
