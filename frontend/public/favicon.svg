<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/> <!-- Emerald 900 -->
      <stop offset="0.5" stop-color="#047857"/> <!-- Emerald 700 -->
      <stop offset="1" stop-color="#065f46"/> <!-- Emerald 800 -->
    </linearGradient>

    <!-- Glowing Effect for Crescent & Star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Golden Gradient for Star -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" /> <!-- Yellow 200 -->
      <stop offset="100%" stop-color="#f59e0b" /> <!-- Amber 500 -->
    </linearGradient>

    <!-- Mask to create a mathematically perfect crescent -->
    <mask id="crescentMask">
      <rect width="64" height="64" fill="white" />
      <circle cx="38" cy="26" r="16" fill="black" />
    </mask>
  </defs>

  <!-- Base rounded rect with deep green gradient and subtle stroke -->
  <rect width="64" height="64" rx="18" fill="url(#g)" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
  
  <g filter="url(#glow)">
    <!-- The Crescent (using mask for perfect geometry) -->
    <circle cx="28" cy="36" r="18" fill="#ecfdf5" mask="url(#crescentMask)" />
    
    <!-- The Star - Placed mathematically at the exact center of the subtracted curve (cx: 38, cy: 26) -->
    <g transform="translate(38, 26)">
      <polygon points="0,-7 2.2,-2.2 7,-2.2 3.1,1.5 4.5,6.5 0,4 -4.5,6.5 -3.1,1.5 -7,-2.2 -2.2,-2.2" fill="url(#gold)"/>
    </g>
  </g>
</svg>
